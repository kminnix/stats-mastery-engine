<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Komore - Stats Practice</title>
    <!-- KaTeX CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="brand">
                <h1>Komore</h1>
                <span class="tagline">Clear, procedural statistics practice</span>
            </div>
            <div class="header-controls">
                <div id="mastery-pill" class="mastery-badge">
                    Streak: <span id="streak-count">0</span> / 5
                </div>
                <button id="reset-progress-btn" class="text-btn" onclick="resetProgress()" title="Reset session stats">Reset</button>
            </div>
        </header>

        <main>
            <div class="card">
                <div class="topic-header">
                    <span class="topic-title">Unit 3: Normal Probability Calculations</span>
                    <span id="session-stats" class="session-stats">Attempts: 0 | Accuracy: 0%</span>
                </div>

                <div id="problem-prompt" class="prompt">Loading problem...</div>

                <div class="input-row">
                    <label for="answer-input"><strong>Answer:</strong></label>
                    <input type="number" step="any" id="answer-input" placeholder="e.g. 0.4532" autocomplete="off">
                    <button id="submit-btn" onclick="submitAnswer()">Submit Answer</button>
                    <button id="next-btn" onclick="loadProblem()" style="display: none;">Next Problem &rarr;</button>
                </div>

                <div id="feedback-banner" style="display: none;"></div>
            </div>

            <div id="solution-card" class="card solution" style="display: none;">
                <h3>Step-by-Step Worked Solution</h3>
                
                <div class="graph-container">
                    <svg id="normal-curve-svg" viewBox="0 0 600 220" preserveAspectRatio="xMidYMid meet"></svg>
                </div>

                <div id="solution-content"></div>
            </div>
        </main>
    </div>

    <script>
        const STORAGE_KEY = 'komore_normal_unit3_state';
        let currentProblem = null;

        // Local state schema
        let state = {
            streak: 0,
            targetMastery: 5,
            totalAttempted: 0,
            totalCorrect: 0,
            mastered: false
        };

        function loadSavedState() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    state = Object.assign(state, JSON.parse(saved));
                }
            } catch (e) {
                console.warn('localStorage not accessible, using in-memory state');
            }
            updateStatsUI();
        }

        function saveState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            } catch (e) {
                console.warn('Failed to save to localStorage');
            }
            updateStatsUI();
        }

        function resetProgress() {
            if (confirm("Reset your streak and session stats for this module?")) {
                state.streak = 0;
                state.totalAttempted = 0;
                state.totalCorrect = 0;
                state.mastered = false;
                saveState();
            }
        }

        function updateStatsUI() {
            const streakCountEl = document.getElementById('streak-count');
            const pillEl = document.getElementById('mastery-pill');
            const statsEl = document.getElementById('session-stats');

            streakCountEl.innerText = state.streak;

            if (state.streak >= state.targetMastery || state.mastered) {
                state.mastered = true;
                pillEl.className = 'mastery-badge mastered';
                pillEl.innerHTML = '&#10004; Mastered (' + state.streak + '/' + state.targetMastery + ')';
            } else {
                pillEl.className = 'mastery-badge';
                pillEl.innerHTML = 'Streak: <span id="streak-count">' + state.streak + '</span> / ' + state.targetMastery;
            }

            const acc = state.totalAttempted > 0 
                ? Math.round((state.totalCorrect / state.totalAttempted) * 100) 
                : 0;
            statsEl.innerText = `Attempts: ${state.totalAttempted} | Accuracy: ${acc}%`;
        }

        function triggerKaTeX(element) {
            if (window.renderMathInElement) {
                renderMathInElement(element, {
                    delimiters: [
                        { left: '$$', right: '$$', display: true },
                        { left: '\\(', right: '\\)', display: false }
                    ],
                    throwOnError: false
                });
            }
        }

        function drawNormalDistribution(plotData) {
            const svg = document.getElementById('normal-curve-svg');
            svg.innerHTML = '';

            const width = 600;
            const baselineY = 175;
            const peakHeight = 140;

            const zMin = -3.5;
            const zMax = 3.5;

            function zToX(z) {
                return ((z - zMin) / (zMax - zMin)) * (width - 80) + 40;
            }

            function gaussian(z) {
                return Math.exp(-0.5 * z * z);
            }

            function zToY(z) {
                return baselineY - gaussian(z) * peakHeight;
            }

            const z1 = Math.max(zMin, Math.min(plotData.z1, zMax));
            const z2 = Math.max(zMin, Math.min(plotData.z2, zMax));
            
            let shadeD = `M ${zToX(z1)} ${baselineY}`;
            const step = 0.05;
            for (let z = z1; z <= z2; z += step) {
                shadeD += ` L ${zToX(z)} ${zToY(z)}`;
            }
            shadeD += ` L ${zToX(z2)} ${zToY(z2)} L ${zToX(z2)} ${baselineY} Z`;

            const shadePath = document.createElementNS("http://www.w3.org/2000/svg", "path");
            shadePath.setAttribute("d", shadeD);
            shadePath.setAttribute("fill", "#93c5fd");
            shadePath.setAttribute("opacity", "0.65");
            svg.appendChild(shadePath);

            let curveD = `M ${zToX(zMin)} ${baselineY}`;
            for (let z = zMin; z <= zMax; z += step) {
                curveD += ` L ${zToX(z)} ${zToY(z)}`;
            }
            curveD += ` L ${zToX(zMax)} ${baselineY}`;

            const curvePath = document.createElementNS("http://www.w3.org/2000/svg", "path");
            curvePath.setAttribute("d", curveD);
            curvePath.setAttribute("fill", "none");
            curvePath.setAttribute("stroke", "#1e40af");
            curvePath.setAttribute("stroke-width", "2.5");
            svg.appendChild(curvePath);

            const axisLine = document.createElementNS("http://www.w3.org/2000/svg", "line");
            axisLine.setAttribute("x1", "20");
            axisLine.setAttribute("y1", baselineY);
            axisLine.setAttribute("x2", width - 20);
            axisLine.setAttribute("y2", baselineY);
            axisLine.setAttribute("stroke", "#4b5563");
            axisLine.setAttribute("stroke-width", "1.5");
            svg.appendChild(axisLine);

            const meanLine = document.createElementNS("http://www.w3.org/2000/svg", "line");
            meanLine.setAttribute("x1", zToX(0));
            meanLine.setAttribute("y1", baselineY);
            meanLine.setAttribute("x2", zToX(0));
            meanLine.setAttribute("y2", zToY(0));
            meanLine.setAttribute("stroke", "#9ca3af");
            meanLine.setAttribute("stroke-dasharray", "4 4");
            svg.appendChild(meanLine);

            function addTick(z, label, subLabel, isBold = false) {
                const x = zToX(z);
                const tick = document.createElementNS("http://www.w3.org/2000/svg", "line");
                tick.setAttribute("x1", x);
                tick.setAttribute("y1", baselineY);
                tick.setAttribute("x2", x);
                tick.setAttribute("y2", baselineY + 6);
                tick.setAttribute("stroke", isBold ? "#1e40af" : "#6b7280");
                tick.setAttribute("stroke-width", isBold ? "2" : "1");
                svg.appendChild(tick);

                const txt = document.createElementNS("http://www.w3.org/2000/svg", "text");
                txt.setAttribute("x", x);
                txt.setAttribute("y", baselineY + 19);
                txt.setAttribute("text-anchor", "middle");
                txt.setAttribute("font-size", "12");
                txt.setAttribute("font-family", "inherit");
                txt.setAttribute("fill", isBold ? "#1e40af" : "#374151");
                if (isBold) txt.setAttribute("font-weight", "bold");
                txt.textContent = label;
                svg.appendChild(txt);

                if (subLabel) {
                    const subTxt = document.createElementNS("http://www.w3.org/2000/svg", "text");
                    subTxt.setAttribute("x", x);
                    subTxt.setAttribute("y", baselineY + 33);
                    subTxt.setAttribute("text-anchor", "middle");
                    subTxt.setAttribute("font-size", "11");
                    subTxt.setAttribute("font-family", "inherit");
                    subTxt.setAttribute("fill", "#6b7280");
                    subTxt.textContent = subLabel;
                    svg.appendChild(subTxt);
                }
            }

            addTick(0, `Mean = ${plotData.mu}`, "z = 0");
            addTick(plotData.z1, `x1 = ${plotData.x1}`, `z = ${plotData.z1}`, true);
            addTick(plotData.z2, `x2 = ${plotData.x2}`, `z = ${plotData.z2}`, true);
        }

        async function loadProblem() {
            document.getElementById('feedback-banner').style.display = 'none';
            document.getElementById('solution-card').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('submit-btn').style.display = 'inline-block';
            
            const input = document.getElementById('answer-input');
            input.disabled = false;
            input.value = '';

            try {
                const res = await fetch('/api/problem/normal');
                currentProblem = await res.json();

                const promptEl = document.getElementById('problem-prompt');
                promptEl.innerHTML = currentProblem.prompt;
                triggerKaTeX(promptEl);
                input.focus();
            } catch (err) {
                document.getElementById('problem-prompt').innerText = 'Failed to load problem. Check server connection.';
            }
        }

        async function submitAnswer() {
            const rawVal = document.getElementById('answer-input').value.trim();
            if (!rawVal) return;

            const userVal = parseFloat(rawVal);
            const res = await fetch('/api/verify', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    user_answer: userVal,
                    expected_answers: currentProblem.expected_answers,
                    tolerance: currentProblem.tolerance
                })
            });

            const data = await res.json();
            const feedback = document.getElementById('feedback-banner');
            feedback.style.display = 'block';

            state.totalAttempted += 1;

            if (data.correct) {
                state.streak += 1;
                state.totalCorrect += 1;
                feedback.className = 'banner correct';
                feedback.innerHTML = '&#10004; Correct! Great job.';
            } else {
                state.streak = 0;
                feedback.className = 'banner incorrect';
                feedback.innerHTML = '&#10008; Incorrect. Review the worked solution below:';
                
                const solCard = document.getElementById('solution-card');
                const solContent = document.getElementById('solution-content');
                
                drawNormalDistribution(currentProblem.plot_data);
                solContent.innerHTML = currentProblem.solution;
                triggerKaTeX(solContent);
                solCard.style.display = 'block';
            }

            saveState();

            document.getElementById('submit-btn').style.display = 'none';
            document.getElementById('answer-input').disabled = true;
            document.getElementById('next-btn').style.display = 'inline-block';
            document.getElementById('next-btn').focus();
        }

        document.getElementById('answer-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') submitAnswer();
        });

        window.addEventListener('load', () => {
            loadSavedState();
            loadProblem();
        });
    </script>
</body>
</html>
