<!-- MULTI-EDGE DOCKED & FLOATING CALCULATOR -->
<div id="calc-dock" class="dock-bottom" style="display: none !important;">
    <div id="calc-dock-resizer" class="dock-edge-resizer"></div>
    <div class="calc-header" id="calc-titlebar">
        <div class="calc-header-topbar">
            <div class="calc-dock-controls">
                <button class="calc-header-btn" onclick="setCalcDockMode('left')" title="Dock Left">◧</button>
                <button class="calc-header-btn active" id="btn-dock-bottom" onclick="setCalcDockMode('bottom')" title="Dock Bottom">&#11027;</button>
                <button class="calc-header-btn" onclick="setCalcDockMode('right')" title="Dock Right">◨</button>
                <button class="calc-header-btn" onclick="setCalcDockMode('float')" title="Float / Undock">⬈</button>
                <button class="calc-header-btn" id="calc-maximize-btn" onclick="toggleMaximizeCalculator()" title="Maximize / Restore">🗖</button>
                <button class="calc-header-btn tool-popout" onclick="popOutCalculatorWindow()" title="Open in New Tab / Window">↗</button>
            </div>
            <div style="display: flex; gap: 6px; align-items: center;">
                <button class="calc-header-btn" onclick="toggleCalculatorAngleMode()" id="calc-angle-btn">DEG</button>
                <button class="calc-header-btn calc-header-close" onclick="closeCalculatorWindow()">×</button>
            </div>
        </div>
        <div class="calc-display-section">
            <div id="calc-history-list" class="calc-history-list"></div>
            <math-field id="calc-mathfield"></math-field>
        </div>
    </div>
    <div class="calc-tray" id="calc-grid-keypad">
        <div id="calc-bank-main" class="calc-keypad-block calc-block-vars">
            <button class="calc-key-btn" onclick="calcInsert('x')">x</button>
            <button class="calc-key-btn" onclick="calcInsert('y')">y</button>
            <button class="calc-key-btn" onclick="calcInsert('(')">(</button>
            <button class="calc-key-btn" onclick="calcInsert(')')">)</button>
            <button class="calc-key-btn calc-btn-op" onclick="calcEvaluate()">=</button>
            <button class="calc-key-btn" onclick="calcInsertSqrt()">√</button>
            <button class="calc-key-btn" onclick="calcInsert('^2')">a²</button>
            <button class="calc-key-btn" onclick="calcInsert('^')">a^b</button>
            <button class="calc-key-btn calc-btn-funcs" onclick="toggleKeypadBank('funcs')">Funcs</button>
            <button class="calc-key-btn" onclick="calcInsertAns()">Ans</button>
            <button class="calc-key-btn" onclick="calcInsertFraction()">a/b</button>
            <button class="calc-key-btn" onclick="calcInsert(',')">,</button>
            <button class="calc-key-btn" onclick="calcInsert('\\pi')">π</button>
            <button class="calc-key-btn" onclick="calcInsert('e')">e</button>
            <button class="calc-key-btn" onclick="calcInsertAbs()">|x|</button>
            <button class="calc-key-btn" onclick="calcInsertNthRoot()">ⁿ√</button>
        </div>
        <div id="calc-bank-funcs" class="calc-keypad-block calc-block-vars" style="display: none;">
            <button class="calc-key-btn" onclick="calcInsert('\\sin(')">sin</button>
            <button class="calc-key-btn" onclick="calcInsert('\\cos(')">cos</button>
            <button class="calc-key-btn" onclick="calcInsert('\\tan(')">tan</button>
            <button class="calc-key-btn" onclick="calcInsert('!')">!</button>
            <button class="calc-key-btn" onclick="calcInsert('\\arcsin(')">sin⁻¹</button>
            <button class="calc-key-btn" onclick="calcInsert('\\arccos(')">cos⁻¹</button>
            <button class="calc-key-btn" onclick="calcInsert('\\arctan(')">tan⁻¹</button>
            <button class="calc-key-btn" onclick="calcInsert('\\ln(')">ln</button>
            <button class="calc-key-btn calc-btn-funcs" onclick="toggleKeypadBank('main')">123</button>
            <button class="calc-key-btn" onclick="calcInsert('\\log_{10}(')">log</button>
            <button class="calc-key-btn" onclick="calcInsert('nCr(')">nCr</button>
            <button class="calc-key-btn" onclick="calcInsert('nPr(')">nPr</button>
            <button class="calc-key-btn" onclick="calcInsert('mean(')">mean</button>
            <button class="calc-key-btn" onclick="calcInsert('std(')">stdev</button>
            <button class="calc-key-btn" onclick="calcInsertAbs()">|x|</button>
            <button class="calc-key-btn" onclick="calcInsertNthRoot()">ⁿ√</button>
        </div>
        <div class="calc-keypad-block calc-block-numpad">
            <button class="calc-key-btn" onclick="calcInsert('7')">7</button>
            <button class="calc-key-btn" onclick="calcInsert('8')">8</button>
            <button class="calc-key-btn" onclick="calcInsert('9')">9</button>
            <button class="calc-key-btn calc-btn-op" onclick="calcInsertFraction()" title="Divide (Creates Fraction)">÷</button>
            <button class="calc-key-btn" onclick="calcInsert('4')">4</button>
            <button class="calc-key-btn" onclick="calcInsert('5')">5</button>
            <button class="calc-key-btn" onclick="calcInsert('6')">6</button>
            <button class="calc-key-btn calc-btn-op" onclick="calcInsert('\\times ')">×</button>
            <button class="calc-key-btn" onclick="calcInsert('1')">1</button>
            <button class="calc-key-btn" onclick="calcInsert('2')">2</button>
            <button class="calc-key-btn" onclick="calcInsert('3')">3</button>
            <button class="calc-key-btn calc-btn-op" onclick="calcInsert('-')">−</button>
            <button class="calc-key-btn" onclick="calcInsert('0')">0</button>
            <button class="calc-key-btn" onclick="calcInsert('.')">.</button>
            <button class="calc-key-btn" onclick="calcInsert('\\pi')">π</button>
            <button class="calc-key-btn calc-btn-op" onclick="calcInsert('+')">+</button>
        </div>
        <div class="calc-keypad-block calc-block-nav">
            <button class="calc-key-btn calc-btn-del" onclick="calcBackspace()" title="Backspace">⌫</button>
            <button class="calc-key-btn" onclick="calcClear()" title="Clear">AC</button>
            <button class="calc-key-btn" onclick="calcNav('left')">←</button>
            <button class="calc-key-btn" onclick="calcNav('right')">→</button>
            <button class="calc-key-btn" onclick="calcNav('up')">↑</button>
            <button class="calc-key-btn" onclick="calcNav('down')">↓</button>
            <button class="calc-key-btn calc-btn-enter" onclick="calcEvaluate()">ENTER</button>
        </div>
    </div>
    <div id="calc-resize-grip" class="window-resize-grip" title="Drag to resize"></div>
</div>
